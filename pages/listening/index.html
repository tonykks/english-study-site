<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>듣기 학습 | Tony's English</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/shared-hero.css">
  <style>
    :root {
      --card-cols-mobile: 2;
      --card-cols-desktop: 4;
    }
    .shared-banner {
      background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url("../../images/main_banner.jpg");
      background-position: center;
      background-size: cover;
    }
    .content-grid {
      display: grid;
      grid-template-columns: repeat(var(--card-cols-mobile), minmax(0, 1fr));
      gap: 0.9rem;
      align-items: stretch;
    }
    @media (min-width: 768px) {
      .content-grid {
        grid-template-columns: repeat(var(--card-cols-desktop), minmax(0, 1fr));
      }
    }
    .lesson-card {
      border: 1px solid #e5e7eb;
      border-radius: 0.9rem;
      background: #ffffff;
      padding: 1rem;
      min-height: 210px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .lesson-card.is-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .lesson-card.is-link:hover {
      transform: translateY(-2px);
      border-color: #a5b4fc;
      box-shadow: 0 10px 20px -14px rgba(79, 70, 229, 0.7);
    }
    .lesson-tag {
      display: inline-flex;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
    }
    .lesson-card.placeholder {
      background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
      border-style: dashed;
    }
    .lesson-preview {
      margin-top: 0.1rem;
      font-size: 0.84rem;
      line-height: 1.45;
      color: #4b5563;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="shared-banner relative h-[220px] border-b border-gray-200 md:h-[350px]">
    <div class="relative z-10 mx-auto flex h-full max-w-6xl flex-col items-center justify-center px-4 text-white">
      <h1 class="hero-title">토니와 함께하는 말하기영어</h1>
      <p class="hero-subtitle">Master English word order, and speaking becomes natural.</p>
      <nav class="hero-main-nav">
        <a href="../../index.html" class="btn-main px-4 py-2 text-center">Introduction</a>
        <div class="menu-group">
          <a href="./index.html" class="btn-main block px-4 py-2 text-center">Listening</a>
          <div class="submenu">
            <a href="./index.html?level=level1">초급</a>
            <a href="./index.html?level=level2">중급</a>
            <a href="./index.html?level=level3">고급</a>
          </div>
        </div>
        <div class="menu-group">
          <a href="../grammar/index.html" class="btn-main block px-4 py-2 text-center">Grammar</a>
          <div class="submenu">
            <a href="../grammar/index.html?level=basic">초급</a>
            <a href="../grammar/index.html?level=intermediate">중급</a>
            <a href="../grammar/index.html?level=advanced">고급</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 pb-8 pt-16">
    <section class="mb-6">
      <div class="mx-auto max-w-md rounded-xl border border-indigo-100 bg-white px-5 py-4 text-center shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wide text-gray-500">Current Location</p>
        <h2 id="page-title" class="mt-1 text-xl font-extrabold text-indigo-700">듣기 학습 목록 - Level 1</h2>
      </div>
    </section>

    <section id="card-grid" class="content-grid"></section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const listeningCards = [
        {
          level: "level1",
          title: "The Middle East's Greatest Contributions",
          introEn: "This story explains how the Middle East helped shape human civilization through farming, writing, religion, trade, and knowledge from ancient times to the modern world.",
          tags: ["Level 1", "기초"],
          href: "./level1/The_Middle_East's_Greatest_Contributions/The_Middle_East's_Greatest_Contributions.html"
        },
        {
          level: "level1",
          title: "My Passion",
          introEn: "This story is about my passion for drones, digital making, and AI learning. I want to learn new tools, create meaningful things, and share my joy with other people.",
          tags: ["Level 1", "스토리"],
          href: "./level1/My_passion/My_passion.html"
        },
        {
          level: "level2",
          title: "KFC Success Story",
          introEn: "This story introduces the life of Colonel Harland Sanders, showing how he overcame many failures and challenges to build the global brand KFC through persistence and belief in himself.",
          tags: ["Level 2", "중급"],
          href: "./level2/KFC_Success_Story/KFC_Success_Story.html"
        },
        {
          level: "level3",
          title: "Crisis in Middle East",
          introEn: "This text explains the recent crisis in the Middle East, including changes in Syria and Yemen, conflict involving Israel, internal unrest in Iran, a major escalation in February 2026, Iran's retaliation, and the long path toward peace.",
          tags: ["Level 3", "고급"],
          href: "./level3/Crisis_in_Middle_East/Crisis_in_Middle_East.html"
        },
        {
          level: "level3",
          title: "The Girl Who Never Give Up",
          introEn: "This story follows Maya, a quiet girl from a small town who loves drawing but is afraid to speak openly about her dream of becoming an artist.",
          tags: ["Level 3", "스토리"],
          href: "./level3/The_Girl_Who_Never_Give_Up/The_Girl_Who_Never_Give_Up.html"
        },
        {
          level: "level2",
          title: "How the Swiss Protected Hitler's Gold",
          introEn: "This lesson explores the dark history of Swiss banks during World War II, focusing on how their policy of neutrality allowed them to profit from Nazi-looted gold and ignore humanitarian atrocities.",
          tags: ["Level 2", "중급"],
          href: "./level2/How_the_Swiss_Protected_Hitler's_Gold/How_the_Swiss_Protected_Hitler's_Gold.html"
        },
        {
          level: "level2",
          title: "Michael Dell: The Father of the PC Industry",
          introEn: "This story explores how Michael Dell transformed the computer industry by launching a successful direct-selling business from his dorm room and building it into a global powerhouse.",
          tags: ["Level 2", "중급"],
          href: "./level2/Michael_Dell_The_Father_of_the_PC_Industry/Michael_Dell_The_Father_of_the_PC_Industry.html"
        },
        {
          level: "level2",
          title: "Here's Why Your Next Cup of Coffee Will Cost $25",
          introEn: "This lesson explores the complex journey of coffee from the farm to your cup, explaining why the low prices we pay today do not reflect the difficult work required to produce it.",
          tags: ["Level 2", "중급"],
          href: "./level2/Here's_Why_Your_Next_Cup_of_Coffee_Will_Cost_25/Here's_Why_Your_Next_Cup_of_Coffee_Will_Cost_25.html"
        },
        {
          level: "level2",
          title: "The Rise of Airbnb: From Airbeds to Billions",
          introEn: "This story explores how the founders of Airbnb turned a desperate need for rent money into a multi-billion dollar company by using creativity and persistence during a global economic crisis.",
          tags: ["Level 2", "중급"],
          href: "./level2/The_Rise_of_Airbnb_From_Airbeds_to_Billions/The_Rise_of_Airbnb_From_Airbeds_to_Billions.html"
        },
        {
          level: "level2",
          title: "The War of Dirty Tricks: How Richard Branson Defeated British Airways",
          introEn: "This story explores how Richard Branson turned a canceled flight into the launch of Virgin Atlantic and describes his fierce battle against British Airways' unfair attempts to destroy his company.",
          tags: ["Level 2", "중급"],
          href: "./level2/The_War_of_Dirty_Tricks_How_Richard_Branson_Defeated_British_Airways/The_War_of_Dirty_Tricks_How_Richard_Branson_Defeated_British_Airways.html"
        },
      ];
      const params = new URLSearchParams(window.location.search);
      const level = (params.get("level") || "level1").toLowerCase();
      const valid = new Set(["level1", "level2", "level3"]);
      const activeLevel = valid.has(level) ? level : "level1";
      const titleMap = {
        level1: "듣기 학습 목록 - Level 1",
        level2: "듣기 학습 목록 - Level 2",
        level3: "듣기 학습 목록 - Level 3"
      };
      const title = document.getElementById("page-title");
      if (title) title.textContent = titleMap[activeLevel];
      const grid = document.getElementById("card-grid");
      if (!grid) return;
      const filtered = listeningCards.filter((item) => item.level === activeLevel);
      const targetCount = 16;
      const placeholders = Array.from({ length: Math.max(0, targetCount - filtered.length) }, (_, idx) => ({
        title: `준비중 콘텐츠 ${idx + 1}`,
        introEn: "Content preview will be added soon.",
        tags: [activeLevel.toUpperCase(), "준비중"],
        href: ""
      }));
      const allCards = [...filtered, ...placeholders];
      grid.innerHTML = allCards.map((item) => {
        const tagHtml = item.tags.map((tag) => `<span class="lesson-tag">${tag}</span>`).join("");
        const cardBody = `
          <div class="mb-2 flex flex-wrap gap-1">${tagHtml}</div>
          <h3 class="mb-2 text-base font-extrabold text-gray-900">${item.title}</h3>
          <p class="lesson-preview">${item.introEn}</p>
        `;
        if (item.href) {
          return `
            <a href="${item.href}" class="lesson-card is-link">
              ${cardBody}
            </a>
          `;
        }
        return `
          <article class="lesson-card placeholder">
            ${cardBody}
          </article>
        `;
      }).join("");
    });
  </script>
</body>
</html>
