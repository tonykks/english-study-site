<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>듣기 학습 | Tony's English</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/shared-hero.css">
  <style>
    :root {
      --card-cols-mobile: 2;
      --card-cols-desktop: 4;
    }
    .shared-banner {
      background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url("../../images/main_banner.jpg");
      background-position: center;
      background-size: cover;
    }
    .content-grid {
      display: grid;
      grid-template-columns: repeat(var(--card-cols-mobile), minmax(0, 1fr));
      gap: 0.9rem;
      align-items: stretch;
    }
    @media (min-width: 768px) {
      .content-grid {
        grid-template-columns: repeat(var(--card-cols-desktop), minmax(0, 1fr));
      }
    }
    .lesson-card {
      border: 1px solid #e5e7eb;
      border-radius: 0.9rem;
      background: #ffffff;
      padding: 1rem;
      min-height: 210px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .lesson-card.is-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .lesson-card.is-link:hover {
      transform: translateY(-2px);
      border-color: #a5b4fc;
      box-shadow: 0 10px 20px -14px rgba(79, 70, 229, 0.7);
    }
    .lesson-tag {
      display: inline-flex;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
    }
    .lesson-card.placeholder {
      background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
      border-style: dashed;
    }
    .lesson-preview {
      margin-top: 0.1rem;
      font-size: 0.84rem;
      line-height: 1.45;
      color: #4b5563;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="shared-banner relative h-[220px] border-b border-gray-200 md:h-[350px]">
    <div class="relative z-10 mx-auto flex h-full max-w-6xl flex-col items-center justify-center px-4 text-white">
      <h1 class="hero-title">토니와 함께하는 말하기영어</h1>
      <p class="hero-subtitle">Master English word order, and speaking becomes natural.</p>
      <nav class="hero-main-nav">
        <a href="../../index.html" class="btn-main px-4 py-2 text-center">Introduction</a>
        <div class="menu-group">
          <a href="./index.html" class="btn-main block px-4 py-2 text-center">Listening</a>
          <div class="submenu">
            <a href="./index.html?level=level1">초급</a>
            <a href="./index.html?level=level2">중급</a>
            <a href="./index.html?level=level3">고급</a>
            <a href="./index.html?level=level4">심화</a>
            <a href="./index.html?level=level5">최상급</a>
          </div>
        </div>
        <div class="menu-group">
          <a href="../grammar/index.html" class="btn-main block px-4 py-2 text-center">Grammar</a>
          <div class="submenu">
            <a href="../grammar/index.html?level=basic">초급</a>
            <a href="../grammar/index.html?level=intermediate">중급</a>
            <a href="../grammar/index.html?level=advanced">고급</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 pb-8 pt-16">
    <section class="mb-6">
      <div class="mx-auto max-w-md rounded-xl border border-indigo-100 bg-white px-5 py-4 text-center shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wide text-gray-500">Current Location</p>
        <h2 id="page-title" class="mt-1 text-xl font-extrabold text-indigo-700">듣기 학습 목록 - Level 1</h2>
      </div>
    </section>

    <section id="card-grid" class="content-grid"></section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const fallbackCards = [];
      let listeningCards = fallbackCards;
      try {
        const res = await fetch("../../data/listening_catalog.json", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          listeningCards = (data.items || [])
            .filter((item) => ["published", "active", ""].includes(String(item.status || "published").toLowerCase()))
            .map((item) => ({
              level: `level${item.level}`,
              title: item.title || "",
              introEn: item.introEn || item.title || "",
              tags: item.tags || [`Level ${item.level}`],
              href: item.href || `./content/${item.video_id}/${item.video_id}.html`,
              video_id: item.video_id || ""
            }));
        }
      } catch (error) {
        console.warn("catalog load failed; empty list", error);
      }

      const params = new URLSearchParams(window.location.search);
      const level = (params.get("level") || "level1").toLowerCase();
      const valid = new Set(["level1", "level2", "level3", "level4", "level5"]);
      const activeLevel = valid.has(level) ? level : "level1";
      const titleMap = {
        level1: "듣기 학습 목록 - Level 1",
        level2: "듣기 학습 목록 - Level 2",
        level3: "듣기 학습 목록 - Level 3",
        level4: "듣기 학습 목록 - Level 4",
        level5: "듣기 학습 목록 - Level 5"
      };
      const title = document.getElementById("page-title");
      if (title) title.textContent = titleMap[activeLevel];
      const grid = document.getElementById("card-grid");
      if (!grid) return;
      const filtered = listeningCards.filter((item) => item.level === activeLevel);
      const targetCount = 16;
      const placeholders = Array.from({ length: Math.max(0, targetCount - filtered.length) }, (_, idx) => ({
        title: `준비중 콘텐츠 ${idx + 1}`,
        introEn: "Content preview will be added soon.",
        tags: [activeLevel.toUpperCase(), "준비중"],
        href: ""
      }));
      const allCards = [...filtered, ...placeholders];
      grid.innerHTML = allCards.map((item) => {
        const tagHtml = item.tags.map((tag) => `<span class="lesson-tag">${tag}</span>`).join("");
        const cardBody = `
          <div class="mb-2 flex flex-wrap gap-1">${tagHtml}</div>
          <h3 class="mb-2 text-base font-extrabold text-gray-900">${item.title}</h3>
          <p class="lesson-preview">${item.introEn}</p>
        `;
        if (item.href) {
          return `
            <a href="${item.href}" class="lesson-card is-link">
              ${cardBody}
            </a>
          `;
        }
        return `
          <article class="lesson-card placeholder">
            ${cardBody}
          </article>
        `;
      }).join("");
    });
  </script>
</body>
</html>
